name: Release plugin JAR

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.repository }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Resolve release metadata
        shell: bash
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            TAG="$GITHUB_REF_NAME"
            VERSION="${TAG#v}"
            PRERELEASE="false"
          else
            TAG="latest"
            VERSION="latest"
            PRERELEASE="true"
          fi
          echo "REPO_NAME=$REPO_NAME" >> "$GITHUB_ENV"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "PRERELEASE=$PRERELEASE" >> "$GITHUB_ENV"

      - name: Build plugin
        run: mvn -B -ntp clean package

      - name: Prepare release asset
        shell: bash
        run: |
          JAR="$(find target -maxdepth 1 -type f -name '*.jar' \
            ! -name '*-sources.jar' \
            ! -name '*-javadoc.jar' \
            ! -name 'original-*.jar' \
            -printf '%s %p\n' | sort -nr | head -n 1 | cut -d' ' -f2-)"
          if [[ -z "$JAR" || ! -f "$JAR" ]]; then
            echo 'No plugin JAR was produced.' >&2
            exit 1
          fi
          mkdir -p release
          ASSET_PATH="release/${REPO_NAME}-${VERSION}.jar"
          cp "$JAR" "$ASSET_PATH"
          echo "ASSET_PATH=$ASSET_PATH" >> "$GITHUB_ENV"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET_PATH" --clobber
            if [[ "$PRERELEASE" == "true" ]]; then
              gh release edit "$TAG" \
                --title "${REPO_NAME} Latest Development Build" \
                --notes "Automatically built from commit ${GITHUB_SHA}." \
                --target "$GITHUB_SHA" \
                --prerelease
            fi
          else
            if [[ "$PRERELEASE" == "true" ]]; then
              gh release create "$TAG" "$ASSET_PATH" \
                --title "${REPO_NAME} Latest Development Build" \
                --notes "Automatically built from commit ${GITHUB_SHA}." \
                --target "$GITHUB_SHA" \
                --prerelease
            else
              gh release create "$TAG" "$ASSET_PATH" \
                --title "${REPO_NAME} ${TAG}" \
                --generate-notes \
                --target "$GITHUB_SHA"
            fi
          fi
